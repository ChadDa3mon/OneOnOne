<div class="d-flex justify-content-between align-items-start border-bottom py-2" id="quick-note-{{ note.pk }}">
    <div>
        <div class="small text-muted">{{ note.created_at|date:"M j, Y g:i A" }}</div>
        <div style="white-space: pre-wrap;">{{ note.text }}</div>
    </div>
    <button type="button" class="btn btn-sm btn-link text-danger p-0 ms-2"
            hx-post="{% url 'quick-note-delete' note.pk %}"
            hx-target="#quick-note-{{ note.pk }}" hx-swap="outerHTML"
            hx-confirm="Delete this note?">&times;</button>
</div>
