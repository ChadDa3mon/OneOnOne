<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Manager{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f7f7fb; }
        .navbar-brand { font-weight: 600; }
        .card { border: 1px solid #e5e5ec; }
        textarea { white-space: pre-wrap; }
        .action-item.done label { text-decoration: line-through; color: #888; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'report-list' %}">Manager</a>
        <div class="navbar-nav">
            <a class="nav-link" href="{% url 'report-list' %}">Direct Reports</a>
            <a class="nav-link" href="{% url 'question-list' %}">Questions</a>
        </div>
    </div>
</nav>
<div class="container pb-5">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-success">{{ message }}</div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
