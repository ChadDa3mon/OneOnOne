<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}People Cache{% endblock %}</title>
    <script>
        (function () {
            var stored = localStorage.getItem("theme");
            var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            document.documentElement.setAttribute("data-bs-theme", theme);
        })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: var(--bs-tertiary-bg); }
        .navbar-brand { font-weight: 600; }
        .card { border: 1px solid var(--bs-border-color); }
        textarea { white-space: pre-wrap; }
        .action-item.done label { text-decoration: line-through; color: var(--bs-secondary-color); }
        #nav-search-results:empty { display: none; }
        .markdown-body pre { background: var(--bs-tertiary-bg); padding: .75rem; border-radius: .375rem; overflow-x: auto; }
        .markdown-body code { background: var(--bs-tertiary-bg); padding: .1rem .3rem; border-radius: .25rem; }
        .markdown-body pre code { background: none; padding: 0; }
        .markdown-body blockquote { border-left: 3px solid var(--bs-border-color); padding-left: 1rem; color: var(--bs-secondary-color); }
        .markdown-body img { max-width: 100%; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'dashboard' %}" title="Because human relationships shouldn't rely on RAM.">People Cache</a>
        <div class="navbar-nav me-auto">
            <a class="nav-link" href="{% url 'report-list' %}">Direct Reports</a>
            <a class="nav-link" href="{% url 'contact-list' %}">Contacts</a>
            <a class="nav-link" href="{% url 'resource-list' %}">Resources</a>
            <a class="nav-link" href="{% url 'question-list' %}">Questions</a>
            <a class="nav-link" href="{% url 'ai-settings' %}">AI Settings</a>
            <a class="nav-link" href="{% url 'backup-download' %}">Backup</a>
        </div>
        <div class="position-relative me-3" style="width: 220px;">
            <input type="search" id="nav-search" name="q" class="form-control form-control-sm" placeholder="Search…"
                   autocomplete="off"
                   hx-get="{% url 'global-search' %}" hx-trigger="keyup changed delay:250ms, search"
                   hx-target="#nav-search-results" hx-swap="innerHTML">
            <div id="nav-search-results"></div>
        </div>
        <button type="button" class="btn btn-sm btn-outline-light me-2" data-bs-toggle="modal"
                data-bs-target="#quick-note-modal" data-default-target="{{ current_target|default:'' }}">
            + Note
        </button>
        <button type="button" id="theme-toggle" class="btn btn-sm btn-outline-light">Dark mode</button>
    </div>
</nav>

<div class="modal fade" id="quick-note-modal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="quick-note-form" hx-post="{% url 'quick-note-add' %}" hx-target="#quick-note-status" hx-swap="innerHTML">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title">Quick note</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="quick-note-status"></div>
                    <div class="mb-3">
                        <label class="form-label" for="quick-note-target">About</label>
                        <select id="quick-note-target" name="target" class="form-control" required>
                            <option value="" disabled selected>Choose a person…</option>
                            {% if quick_note_reports %}
                            <optgroup label="Direct Reports">
                                {% for r in quick_note_reports %}
                                <option value="report:{{ r.pk }}">{{ r.name }}</option>
                                {% endfor %}
                            </optgroup>
                            {% endif %}
                            {% if quick_note_contacts %}
                            <optgroup label="Contacts">
                                {% for c in quick_note_contacts %}
                                <option value="contact:{{ c.pk }}">{{ c.name }}</option>
                                {% endfor %}
                            </optgroup>
                            {% endif %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="quick-note-text">Note</label>
                        <textarea id="quick-note-text" name="text" class="form-control" rows="4"
                                  placeholder="Jot down anything worth remembering…" required></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary btn-sm">Save note</button>
                </div>
            </form>
        </div>
    </div>
</div>
<div class="container pb-5">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'success' }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htmx.org@1.9.12/dist/htmx.min.js"></script>
<script>
    // Django's CSRF protection requires this header on any state-changing
    // request; htmx has no built-in Django integration, so attach it here
    // to every request htmx makes (reads the cookie Django's own {% csrf_token %}
    // machinery already sets - no extra endpoint needed).
    function getCookie(name) {
        var match = document.cookie.match("(^|;\\s*)" + name + "=([^;]*)");
        return match ? decodeURIComponent(match[2]) : null;
    }
    document.body.addEventListener("htmx:configRequest", function (event) {
        event.detail.headers["X-CSRFToken"] = getCookie("csrftoken");
    });
</script>
<script>
    (function () {
        var button = document.getElementById("theme-toggle");
        function label(theme) {
            button.textContent = theme === "dark" ? "Light mode" : "Dark mode";
        }
        label(document.documentElement.getAttribute("data-bs-theme"));
        button.addEventListener("click", function () {
            var current = document.documentElement.getAttribute("data-bs-theme");
            var next = current === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-bs-theme", next);
            localStorage.setItem("theme", next);
            label(next);
        });
    })();
</script>
<script>
    // Any submit button marked class="ai-submit" triggers a slow (Ollama-backed)
    // action. Disable and relabel just that button once its form is submitted -
    // using event.submitter (not "the form's first submit button") because a form
    // can have other, ordinary buttons that should submit normally.
    document.addEventListener("submit", function (event) {
        var button = event.submitter;
        if (!button || !button.classList.contains("ai-submit")) return;
        var loadingText = button.dataset.loadingText || "Generating… this can take a minute";
        // Disabling the button synchronously here would drop its name=value
        // pair from the submitted form data in most browsers (a disabled
        // control is excluded once the submit fires) - deferring to the next
        // tick lets the browser finish capturing the submission first.
        setTimeout(function () {
            button.disabled = true;
            button.textContent = loadingText;
        }, 0);
    });
</script>
<script>
    (function () {
        var modalEl = document.getElementById("quick-note-modal");
        var form = document.getElementById("quick-note-form");
        var select = document.getElementById("quick-note-target");

        // Preselect the person whose page the "+ Note" button was clicked
        // from, so logging a note about whoever you're already looking at
        // is a single click plus typing - no extra picking.
        modalEl.addEventListener("show.bs.modal", function (event) {
            var button = event.relatedTarget;
            var defaultTarget = button ? button.getAttribute("data-default-target") : "";
            if (defaultTarget) select.value = defaultTarget;
        });

        document.body.addEventListener("quick-note-saved", function () {
            setTimeout(function () {
                form.reset();
                document.getElementById("quick-note-status").innerHTML = "";
                var modal = bootstrap.Modal.getInstance(modalEl);
                if (modal) modal.hide();
            }, 900);
        });
    })();
</script>
<script>
    (function () {
        var input = document.getElementById("nav-search");
        var results = document.getElementById("nav-search-results");
        // Delay the clear so a click on a result link still registers
        // before we wipe the dropdown out from under it.
        input.addEventListener("blur", function () {
            setTimeout(function () { results.innerHTML = ""; }, 150);
        });
    })();
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
